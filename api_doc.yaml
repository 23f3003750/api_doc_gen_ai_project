openapi: 3.0.3
info:
  title: "AI Home Manager - API Documentation"
  description: "REST API specification for the AI Home Manager backend covering Authentication, Tasks, Calendar, Food & Inventory, and Finance & Budgeting."
  version: "1.5.0"
  contact:
    name: "Vibe Crew"

servers:
  - url: "http://localhost:5000"
    description: "Local development server"

tags:
  - name: "System & Health"
    description: "System monitoring and health diagnostics"
  - name: "Authentication & Permissions"
    description: "Household setup, authentication, invites, and RBAC lifecycle management (US-1.1 to US-1.5)"
  - name: "Tasks"
    description: "Household task creation, status updates, editing, deletion, and assignment queries (US-2.2, US-2.3)"
  - name: "Calendar"
    description: "Shared household calendar appointments, conflict detection, updates, and deletion (US-2.5, US-2.6)"
  - name: "Food & Inventory"
    description: "Inventory levels, low-stock tracking, grocery lists, commodities, updates, and deletion (US-3.1, US-3.4 to US-3.6)"
  - name: "Finance & Budgeting"
    description: "Household expenses, category budgets, and recurring bills CRUD (US-4.2 to US-4.4)"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Provide the JWT access token obtained via register or login. Payload includes user identity and role (Admin, Adult, Child, Guest)."

  schemas:
    HouseholdRole:
      type: string
      enum:
        - Admin
        - Adult
        - Child
        - Guest

    TaskPriority:
      type: string
      enum:
        - Low
        - Normal
        - High

    TaskStatus:
      type: string
      enum:
        - Open
        - InProgress
        - Done
        - Cancelled

    OccurrenceStatus:
      type: string
      enum:
        - Pending
        - Purchased
        - Skipped

    BudgetPeriod:
      type: string
      enum:
        - Monthly
        - Weekly
        - Custom

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Invalid credentials or unauthorized access"

    SuccessResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Resource deleted successfully"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/HouseholdRole"

    Task:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        title:
          type: string
          example: "Clean living room windows"
        description:
          type: string
          nullable: true
          example: "Wipe interior and exterior glass panels"
        assigned_to:
          type: string
          format: uuid
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-22T18:00:00Z"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"

    CalendarEvent:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        title:
          type: string
          example: "Dentist Appointment"
        starts_at:
          type: string
          format: date-time
          example: "2026-09-25T10:00:00Z"
        ends_at:
          type: string
          format: date-time
          example: "2026-09-25T11:30:00Z"
        owner_id:
          type: string
          format: uuid
          nullable: true

    InventoryItem:
      type: object
      properties:
        item_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Whole Milk"
        quantity:
          type: number
          example: 2.0
        unit:
          type: string
          nullable: true
          example: "liters"
        low_stock_threshold:
          type: number
          nullable: true
          example: 1.0

    GroceryItem:
      type: object
      properties:
        grocery_item_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Eggs"
        quantity:
          type: number
          nullable: true
          example: 12.0
        unit:
          type: string
          nullable: true
          example: "pcs"
        purchased:
          type: boolean
          example: false
        added_by:
          type: string
          format: uuid

    PurchaseOccurrenceSummary:
      type: object
      properties:
        occurrence_id:
          type: string
          format: uuid
        occurrence_date:
          type: string
          format: date
          example: "2026-09-21"
        status:
          $ref: "#/components/schemas/OccurrenceStatus"

    CommodityRule:
      type: object
      properties:
        rule_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Bread"
        schedule:
          type: string
          example: "DAILY"
        quantity:
          type: number
          example: 1.0
        unit:
          type: string
          nullable: true
          example: "loaf"
        preferred_brand:
          type: string
          nullable: true
          example: "Harvest Gold"
        low_stock_threshold:
          type: number
          nullable: true
          example: 1.0
        active:
          type: boolean
          example: true

    CommodityCreateResponse:
      type: object
      properties:
        rule_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Milk"
        schedule:
          type: string
          example: "DAILY"
        quantity:
          type: number
          example: 1.0
        unit:
          type: string
          nullable: true
          example: "litre"
        preferred_brand:
          type: string
          nullable: true
          example: "Amul"
        low_stock_threshold:
          type: number
          nullable: true
          example: 2.0
        today_occurrence:
          $ref: "#/components/schemas/PurchaseOccurrenceSummary"

    Expense:
      type: object
      properties:
        expense_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          example: 4500
        currency:
          type: string
          example: "USD"
        category:
          type: string
          example: "Groceries"
        description:
          type: string
          nullable: true
          example: "Weekly supermarket run"
        occurred_at:
          type: string
          format: date-time
          example: "2026-09-18T12:00:00Z"
        recorded_by:
          type: string
          format: uuid
          nullable: true
        document_id:
          type: string
          format: uuid
          nullable: true

    Budget:
      type: object
      properties:
        budget_id:
          type: string
          format: uuid
        category:
          type: string
          example: "Groceries"
        limit_minor:
          type: integer
          example: 50000
        currency:
          type: string
          example: "USD"
        period:
          $ref: "#/components/schemas/BudgetPeriod"
        period_start:
          type: string
          format: date
          nullable: true
          example: "2026-09-01"
        period_end:
          type: string
          format: date
          nullable: true
          example: "2026-09-30"

    BudgetStatus:
      type: object
      properties:
        category:
          type: string
          example: "Groceries"
        month:
          type: integer
          example: 9
        year:
          type: integer
          example: 2026
        limit_minor:
          type: integer
          example: 50000
        spent_minor:
          type: integer
          example: 12000
        remaining_minor:
          type: integer
          example: 38000
        has_budget:
          type: boolean
          example: true
        is_exceeded:
          type: boolean
          example: false

    RecurringBill:
      type: object
      properties:
        bill_id:
          type: string
          format: uuid
        payee:
          type: string
          example: "City Electric"
        expected_amount_minor:
          type: integer
          example: 8000
        currency:
          type: string
          example: "USD"
        category:
          type: string
          nullable: true
          example: "Utilities"
        due_at:
          type: string
          format: date-time
          example: "2026-09-24T18:00:00Z"
        recurrence:
          type: string
          example: "MONTHLY"

paths:
  /health:
    get:
      tags:
        - "System & Health"
      summary: "Service Health Check"
      description: "Returns operational status of the backend service."
      responses:
        "200":
          description: "Healthy service status"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  service:
                    type: string
                    example: "ai-home-manager"

  /api/auth/register-household:
    post:
      tags:
        - "Authentication & Permissions"
      summary: "Register Household Founder (US-1.1)"
      description: "Registers the first user who is auto-assigned the Admin role."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - display_name
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@home.test"
                password:
                  type: string
                  format: password
                  example: "password123"
                display_name:
                  type: string
                  example: "Ravi Admin"
                date_of_birth:
                  type: string
                  format: date
                  example: "1985-04-12"
      responses:
        "201":
          description: "Household created successfully and Admin role assigned."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Household created"
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Household already initialized or invalid payload."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags:
        - "Authentication & Permissions"
      summary: "Member Authentication"
      description: "Validates credentials and returns a signed bearer JWT."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@home.test"
                password:
                  type: string
                  format: password
                  example: "password123"
      responses:
        "200":
          description: "Authentication successful."
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/UserResponse"
        "401":
          description: "Invalid email or password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Membership pending approval."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/invite:
    post:
      tags:
        - "Authentication & Permissions"
      summary: "Generate Household Invite (US-1.2)"
      description: "Generates a cryptographically secure invite token (Admin only)."
      security:
        - BearerAuth: []
      responses:
        "201":
          description: "Invite code generated."
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite_code:
                    type: string
                    example: "xK9_dF4w29A_qL"
        "403":
          description: "Forbidden - Caller lacks Admin role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/join:
    post:
      tags:
        - "Authentication & Permissions"
      summary: "Join Household via Invite Code (US-1.2)"
      description: "Registers an account using an invite code in a pending status."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invite_code
                - email
                - password
                - display_name
              properties:
                invite_code:
                  type: string
                  example: "xK9_dF4w29A_qL"
                email:
                  type: string
                  format: email
                  example: "priya@home.test"
                password:
                  type: string
                  format: password
                  example: "memberpassword123"
                display_name:
                  type: string
                  example: "Priya Sharma"
                date_of_birth:
                  type: string
                  format: date
                  example: "1990-08-22"
      responses:
        "201":
          description: "Registration received; pending admin review."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Registration successful. Awaiting Admin approval."
                  user_id:
                    type: string
                    format: uuid
        "400":
          description: "Expired or invalid invite code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/members/pending:
    get:
      tags:
        - "Authentication & Permissions"
      summary: "List Pending Applications (US-1.3)"
      description: "Allows Admins to inspect pending member requests."
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "List of pending members."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    email:
                      type: string
                      format: email
                    date_of_birth:
                      type: string
                      format: date
                      nullable: true
        "403":
          description: "Forbidden - Caller is not an Admin."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/members/{user_id}/approve:
    post:
      tags:
        - "Authentication & Permissions"
      summary: "Approve Member and Assign Role (US-1.3)"
      description: "Admin assigns a permanent role to activate a member."
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: "#/components/schemas/HouseholdRole"
      responses:
        "200":
          description: "Member successfully activated."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User approved as Adult"
        "400":
          description: "Invalid role specified or user not pending."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Admin permission required."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/members/{user_id}/role:
    put:
      tags:
        - "Authentication & Permissions"
      summary: "Modify Member Role (US-1.4)"
      description: "Update an active member's role; prevents demoting the last Admin."
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: "#/components/schemas/HouseholdRole"
      responses:
        "200":
          description: "Role updated successfully."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Role updated successfully"
        "400":
          description: "Cannot demote sole household Admin."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Admin permission required."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/transfer-admin:
    post:
      tags:
        - "Authentication & Permissions"
      summary: "Transfer Household Administration (US-1.5)"
      description: "Transfers primary Admin rights to another active Adult member."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - successor_id
              properties:
                successor_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: "Administration transferred."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Admin privileges transferred successfully"
        "400":
          description: "Target member is not an active Adult."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Caller is not an Admin."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/tasks:
    get:
      tags:
        - "Tasks"
      summary: "List Household Tasks (US-2.3)"
      description: "Retrieve household tasks filtered by assignee or status."
      security:
        - BearerAuth: []
      parameters:
        - name: assigned_to
          in: query
          required: false
          schema:
            type: string
          description: "Member UUID or 'me' for caller assigned tasks."
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: "Filtered list of tasks."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          description: "Unauthorized token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - "Tasks"
      summary: "Create Household Task Manually (US-2.2)"
      description: "Manually creates a task. Blocked for Guest accounts."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: "Clean living room windows"
                description:
                  type: string
                  example: "Wipe interior and exterior glass panels"
                assigned_to:
                  type: string
                  format: uuid
                  nullable: true
                due_at:
                  type: string
                  format: date-time
                  example: "2026-09-22T18:00:00Z"
                priority:
                  $ref: "#/components/schemas/TaskPriority"
      responses:
        "201":
          description: "Task created successfully."
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  status:
                    $ref: "#/components/schemas/TaskStatus"
        "400":
          description: "Missing title or invalid parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Guest role cannot write tasks."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/tasks/{task_id}:
    put:
      tags:
        - "Tasks"
      summary: "Update an Existing Task"
      description: "Update task fields (title, description, assignee, priority, status). Blocked for Guests."
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Clean living room windows"
                description:
                  type: string
                  example: "Wipe interior panels and frames"
                assigned_to:
                  type: string
                  format: uuid
                  nullable: true
                due_at:
                  type: string
                  format: date-time
                  example: "2026-09-23T18:00:00Z"
                priority:
                  $ref: "#/components/schemas/TaskPriority"
                status:
                  $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: "Task updated successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: "Invalid input parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Guest role cannot edit tasks."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Task not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - "Tasks"
      summary: "Delete a Task"
      description: "Delete an existing household task. Blocked for Guest accounts."
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Task deleted successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: "Forbidden - Guest role cannot delete tasks."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Task not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/tasks/{task_id}/status:
    patch:
      tags:
        - "Tasks"
      summary: "Update Task Status"
      description: "Updates the lifecycle state of a task. Blocked for Guest accounts."
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: "Task status updated."
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    format: uuid
                  status:
                    $ref: "#/components/schemas/TaskStatus"
        "400":
          description: "Invalid status specified."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Guest role cannot modify tasks."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Task ID not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/calendar:
    get:
      tags:
        - "Calendar"
      summary: "List Shared Calendar Events (US-2.5)"
      description: "View scheduled household events."
      security:
        - BearerAuth: []
      parameters:
        - name: range_start
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: range_end
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: "List of scheduled calendar events."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
        "401":
          description: "Unauthorized token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - "Calendar"
      summary: "Create Calendar Event with Conflict Detection (US-2.6)"
      description: "Create a calendar appointment with automatic overlap detection. Blocked for Guest accounts."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - starts_at
                - ends_at
              properties:
                title:
                  type: string
                  example: "Family Doctor Visit"
                starts_at:
                  type: string
                  format: date-time
                  example: "2026-09-25T10:00:00Z"
                ends_at:
                  type: string
                  format: date-time
                  example: "2026-09-25T11:30:00Z"
      responses:
        "201":
          description: "Event created. Returns detected conflicts if time overlap exists."
          content:
