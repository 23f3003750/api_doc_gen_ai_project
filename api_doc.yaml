      security:
        - BearerAuth: []
      parameters:
        - name: category
          in: query
          required: true
          schema:
            type: string
            example: "Groceries"
        - name: month
          in: query
          required: false
          schema:
            type: integer
            example: 9
        - name: year
          in: query
          required: false
          schema:
            type: integer
            example: 2026
      responses:
        "200":
          description: "Current budget status and remaining balance."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetStatus"
        "400":
          description: "Missing category parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Child and Guest accounts blocked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/finance/bills:
    post:
      tags:
        - "Finance & Budgeting"
      summary: "Register Recurring Household Bill (US-4.3)"
      description: "Register a recurring monthly bill with due date and amount (Admin only)."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payee
                - expected_amount_minor
                - due_at
              properties:
                payee:
                  type: string
                  example: "City Electric"
                expected_amount_minor:
                  type: integer
                  example: 8000
                due_at:
                  type: string
                  format: date-time
                  example: "2026-09-24T18:00:00Z"
                category:
                  type: string
                  example: "Utilities"
                recurrence:
                  type: string
                  default: "MONTHLY"
                  example: "MONTHLY"
                currency:
                  type: string
                  default: "USD"
                  example: "USD"
      responses:
        "201":
          description: "Bill registered successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringBill"
        "400":
          description: "Invalid request payload."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Admin permission required."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/finance/bills/{bill_id}:
    put:
      tags:
        - "Finance & Budgeting"
      summary: "Update a Recurring Bill"
      description: "Edits recurring bill details (Admin only)."
      security:
        - BearerAuth: []
      parameters:
        - name: bill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payee:
                  type: string
                  example: "City Electric"
                expected_amount_minor:
                  type: integer
                  example: 8500
                due_at:
                  type: string
                  format: date-time
                  example: "2026-09-28T18:00:00Z"
                category:
                  type: string
                  example: "Utilities"
                recurrence:
                  type: string
                  example: "MONTHLY"
                currency:
                  type: string
                  example: "USD"
      responses:
        "200":
          description: "Recurring bill updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringBill"
        "400":
          description: "Invalid input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Admin only."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Recurring bill not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - "Finance & Budgeting"
      summary: "Delete a Recurring Bill"
      description: "Delete an existing recurring bill (Admin only)."
      security:
        - BearerAuth: []
      parameters:
        - name: bill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Recurring bill deleted successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: "Forbidden - Admin permission required."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Recurring bill not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/finance/bills/upcoming:
    get:
      tags:
        - "Finance & Budgeting"
      summary: "List Upcoming Bills (US-4.3)"
      description: "Retrieve active recurring bills due within the next N days (Adult/Admin only)."
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: "List of upcoming bills sorted by due date."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bill_id:
                      type: string
                      format: uuid
                    payee:
                      type: string
                    expected_amount_minor:
                      type: integer
                    due_at:
                      type: string
                      format: date-time
                    days_remaining:
                      type: integer
                    category:
                      type: string
                      nullable: true
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Child and Guest accounts blocked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"