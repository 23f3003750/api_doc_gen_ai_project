openapi: 3.0.3
info:
  title: AI Home Manager- API's
  description: >
    REST API for the AI Home Manager backend (Flask + SQLAlchemy + LangGraph).
    Covers authentication, the six data domains (People & Permissions, Tasks &
    Schedule, Food & Inventory, Finance & Budgeting, Home & Maintenance,
    Documents), and the conversational agent endpoint that routes natural
    language requests through the multi-agent orchestrator.
  version: 1.0.0
  contact:
    name: Vibe Crew


servers:
  - url: http://localhost:5000
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Provide the JWT access token obtained during registration or login.
        Contains user identity and household role (Admin, Adult, Child, Guest).

  schemas:
    HouseholdRole:
      type: string
      enum: [Admin, Adult, Child, Guest]

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Invalid credentials or unauthorized access"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/HouseholdRole'

paths:
  /health:
    get:
      summary: Service Health Check
      description: Returns operational status of the service.
      responses:
        '200':
          description: Healthy service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: ai-home-manager

  /api/auth/register-household:
    post:
      summary: Register Household Founder (US-1.1)
      description: >
        Registers the first user who is automatically designated as the household Admin.
        Fails if an active household has already been initialized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - display_name
              properties:
                email:
                  type: string
                  format: email
                  example: admin@home.test
                password:
                  type: string
                  format: password
                  example: password123
                display_name:
                  type: string
                  example: Ravi Admin
                date_of_birth:
                  type: string
                  format: date
                  example: "1985-04-12"
      responses:
        '201':
          description: Household successfully created and Admin assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Household created
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error or household already initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: Member Authentication
      description: Validates member credentials and issues a role-scoped JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@home.test
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Authenticated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Membership pending approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/invite:
    post:
      summary: Generate Household Invite (US-1.2)
      description: Allows Admins to generate an invitation token for prospective members.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Secure invite code generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite_code:
                    type: string
                    example: xK9_dF4w29A_qL...
        '403':
          description: Forbidden - Caller lacks Admin role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/join:
    post:
      summary: Join Household via Invite Code (US-1.2)
      description: Prospective member registers with an invite code into a Pending state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invite_code
                - email
                - password
                - display_name
              properties:
                invite_code:
                  type: string
                  example: xK9_dF4w29A_qL...
                email:
                  type: string
                  format: email
                  example: priya@home.test
                password:
                  type: string
                  format: password
                  example: memberpassword123
                display_name:
                  type: string
                  example: Priya Sharma
                date_of_birth:
                  type: string
                  format: date
                  example: "1990-08-22"
      responses:
        '201':
          description: Registration recorded; awaiting admin approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registration successful. Awaiting Admin approval.
                  user_id:
                    type: string
                    format: uuid
        '400':
          description: Invalid or expired invite code, or duplicate email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/members/pending:
    get:
      summary: List Pending Applications (US-1.3)
      description: Allows an Admin to view prospective members awaiting admission.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pending member profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    email:
                      type: string
                      format: email
                    date_of_birth:
                      type: string
                      format: date
                      nullable: true
        '403':
          description: Forbidden - Admin permission required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/members/{user_id}/approve:
    post:
      summary: Approve Member and Assign Role (US-1.3)
      description: Admin assigns a permanent household role to activate a pending member.
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: '#/components/schemas/HouseholdRole'
      responses:
        '200':
          description: Member successfully activated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User approved as Adult
        '400':
          description: Invalid role specified or member not in pending state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin role required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/members/{user_id}/role:
    put:
      summary: Modify Member Role (US-1.4)
      description: Admin updates an existing active member's role; prevents demoting the last Admin.
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: '#/components/schemas/HouseholdRole'
      responses:
        '200':
          description: Role modified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Role updated successfully
        '400':
          description: Invalid role or illegal demotion of sole Admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin role required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/transfer-admin:
    post:
      summary: Transfer Household Administration (US-1.5)
      description: Current Admin reassigns admin responsibility to another Adult member.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - successor_id
              properties:
                successor_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Admin privileges transferred successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Admin privileges transferred successfully
        '400':
          description: Successor is not an active Adult member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Caller is not the household Admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'